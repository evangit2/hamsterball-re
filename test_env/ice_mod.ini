# ice_mod configuration (plain floats)
# Seconds touching ice until fully cold (input halved, deep blue)
ColdSeconds=5.00
# Seconds to warm back up after leaving ice
WarmupSeconds=5.00
# Input force multiplier at full cold (0.5 = half speed)
InputScale=0.50
# How blue the ball tints at full cold (0..1, smaller = bluer)
TintBlue=0.35
# Ice/water cross-fade duration in seconds
FadeSeconds=1.00
