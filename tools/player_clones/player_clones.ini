[Clones]
; Number of AI clones per player (0=none, max=8)
; Clones share their original player's score
; Clones use COMPUTER AI (chase all entities)
; Works in both races and arenas

; Player 1 (default: no clones)
Player1=0

; Player 2 (default: 2 clones)
Player2=2

; Player 3 (default: 1 clone)
Player3=1

; Player 4 (default: no clones)
Player4=0

[Options]
; 1=enable AI in races (not just arenas)
; This patches the gate at 0x4083AE so all balls run AI chase logic
EnableRaceAI=1

; 1=clones target ALL balls (players + clones + 8-balls)
; 0=clones only target players 1-4
; This patches the targeting filter at 0x4085CD
TargetAll=1
