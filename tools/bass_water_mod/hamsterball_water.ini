[WaterPhysics]
; Vertical velocity multiplier on first entry while falling.
; 0.70 means the ball keeps 70% of its downward speed (loses 30%).
EntryDamping=0.70

; Overall velocity drag per frame while fully submerged (0.03 = 3%).
Drag=0.03

; Extra horizontal-only drag per frame while in water.
HorizontalDrag=0.04

; Effective gravity per frame. Buoyancy is tuned so a ball floats
; half-submerged when vertical velocity reaches zero.
GravityEquivalent=0.45

; Horizontal acceleration dampening. 0.92 lowers the max horizontal
; speed in water to about 92% of normal.
AccelerationDamp=0.92

; Frames a water effect persists without the ball touching the plane again.
TimerFrames=3

[Debug]
; Set to 1 to write a water_mod.log in the game folder.
Debug=0
