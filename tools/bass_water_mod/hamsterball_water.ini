[WaterPhysics]
; Vertical velocity multiplier on first entry while falling.
; 0.70 means the ball keeps 70% of its downward speed (loses 30%).
EntryDamping=0.70

; Overall velocity drag per frame while in water (0.03 = 3%).
Drag=0.03

; Extra horizontal-only drag per frame while in water (0.04 = 4%).
; Combined with Drag, horizontal velocity is multiplied by 1 - (Drag + HorizontalDrag).
HorizontalDrag=0.04

; Effective gravity per frame. The mod disables engine gravity while submerged
; and applies net acceleration = gravity_equivalent * (1 - 2 * submersion).
; At half-submerged the net vertical acceleration is zero, so the ball floats
; at the surface when vertical velocity is also zero.
GravityEquivalent=0.45

; Frames the water effect persists without a fresh collision with an E:WATER plane.
TimerFrames=10

[Debug]
; Set to 1 to write a water_mod.log in the game folder.
Debug=0
