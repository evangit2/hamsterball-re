; Hamsterball Water Physics Mod v2 Configuration
; Place this file next to bass.dll (proxy) in the game folder.

[WaterPhysics]
; Entry damping: velocity multiplier applied to ALL axes when the ball first
; touches the water surface (triggers E:WATER plane).
; 0.70 = all velocity reduced to 70% (30% cut) on contact.
; This modifies VELOCITY (persists across frames), not position.
; Range: 0.0 (stop completely) to 1.0 (no damping).
EntryDamping=0.70

; Drag: per-frame velocity reduction applied to all axes while in water.
; This is a velocity scale factor — the ball actually slows down over time.
; Range: 0.0 (none) to 1.0 (full stop).
Drag=0.03

; Horizontal drag: extra drag on X/Z axes only (in addition to Drag).
; This makes horizontal movement slightly slower in water.
; Range: 0.0 (none) to 1.0 (full stop).
HorizontalDrag=0.04

; Buoyancy strength: upward acceleration at full submersion.
; Submersion is measured relative to the ball's Y at the moment it triggered
; the water surface (not the mesh geometry Y).
; At half-submerged, buoyancy = BuoyancyStrength (roughly cancels gravity).
; At fully submerged, buoyancy = 2 × BuoyancyStrength (net upward force).
; The ball decelerates, stops, then accelerates upward — reaching a stable float.
; Tune this to match the game's gravity (default 0.45 works for standard levels).
BuoyancyStrength=0.45

; Debug: 1 = write water_mod_log.txt, 0 = no log.
Debug=1

[WaterPlanes]
; Fallback water plane Y coordinates (used only if no E:WATER objects are found
; in the level's collision data). You can specify up to 16 planes.
; Count=0 means "rely on E:WATER objects in the level".
;
; Example for a level where you want water at Y=100:
; Count=1
; Y0=100.0
Count=0
