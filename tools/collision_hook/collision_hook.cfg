# Hamsterball Collision Hook Config
# Place this file in the same directory as Hamsterball.exe

# Enable/disable individual hooks (1=on, 0=off)
hook_DispatchCollisionEvents=1
hook_Level=1
hook_Arena=1

# Log options
log_event_names=1
log_ball_pos=1
log_timestamps=1

# Filter: only log events containing this substring (empty = log all)
# Examples: filter=E:JUMP  or  filter=N:GOAL  or  filter=BREAK
filter=
