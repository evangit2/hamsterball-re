; 8ball_spawn.ini — Configuration for the 8-Ball Spawn mod
; Place next to bass.dll in the Hamsterball game folder.

[8ball]
; Virtual key code for spawn (default: B = 0x42)
; Common keys: A=0x41, B=0x42, C=0x43, F1=0x70, F2=0x71
; Full list: https://learn.microsoft.com/en-us/windows/win32/inputdev/virtual-key-codes
spawn_key=0x42

; Distance in front of the player's ball where the 8-ball spawns (default: 40)
spawn_distance=40

; Note: spawn_velocity removed — 8-ball now copies the player's exact velocity
