; Hamsterball Water Physics Mod v7 Configuration
; Place this file next to bass.dll (proxy) in the game folder.

[WaterPhysics]
; Entry damping: velocity multiplier applied to ALL axes when the ball
; collides with an E:WATER object.
; 0.90 = all velocity reduced to 90% (10% cut) on contact.
; Range: 0.0 (stop completely) to 1.0 (no damping).
EntryDamping=0.90

; Drag: per-frame velocity reduction applied to all axes while in water.
; Range: 0.0 (none) to 1.0 (full stop).
Drag=0.02

; Horizontal drag: extra drag on X/Z axes only (in addition to Drag).
; Range: 0.0 (none) to 1.0 (full stop).
HorizontalDrag=0.04

; Buoyancy strength: upward acceleration scaled by normalized submersion (0-1).
; Submersion is 0 when ball is out of water, 0.5 when half submerged,
; 1.0 when fully submerged. Buoyancy = BuoyancyStrength * submersion.
; At 0.90 strength and fully submerged: 0.90/frame upward acceleration.
BuoyancyStrength=1.0

; Running-water current strength (E:WATERFLOW-N/S/E/W planes).
; The ball is carried toward the flow direction at this speed (world
; units/frame). Higher = stronger flow.
CurrentStrength=0.15

; Debug: 1 = write water_mod_log.txt, 0 = no log.
Debug=1
